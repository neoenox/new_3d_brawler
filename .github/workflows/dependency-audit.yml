name: Dependency advisory diagnostics

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect locked dependency advisories (diagnostic only)
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/audit-all.json"
          all_status=$?
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-runtime.json"
          runtime_status=$?
          set -e
          node - "$RUNNER_TEMP/audit-all.json" "$RUNNER_TEMP/audit-runtime.json" "$all_status" "$runtime_status" <<'NODE'
          const fs = require("node:fs");
          const [allPath, runtimePath, allExit, runtimeExit] = process.argv.slice(2);

          function inspect(scope, path, exitCode) {
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            if (report.error || typeof report.metadata?.vulnerabilities?.total !== "number") {
              throw new Error(scope + " audit could not complete: " + JSON.stringify(report.error ?? report));
            }
            if (!["0", "1"].includes(exitCode)) {
              throw new Error(scope + " audit command failed with exit code " + exitCode);
            }
            const findings = Object.entries(report.vulnerabilities ?? {})
              .filter(([, entry]) => ["high", "critical"].includes(entry.severity))
              .map(([name, entry]) => {
                const sources = entry.via
                  .filter((item) => typeof item === "object")
                  .map((item) => String(item.source) + ": " + item.title + " " + item.url);
                return { name, severity: entry.severity, direct: entry.isDirect,
                  range: entry.range, nodes: entry.nodes, fixAvailable: entry.fixAvailable,
                  advisories: sources };
              });
            console.log(scope + " totals:", JSON.stringify(report.metadata.vulnerabilities));
            for (const finding of findings) {
              console.log(scope + " high/critical:", JSON.stringify(finding));
            }
            return { total: report.metadata.vulnerabilities.total, highOrCritical: findings.length };
          }

          const all = inspect("all-dependencies", allPath, allExit);
          const runtime = inspect("runtime-only", runtimePath, runtimeExit);
          const summary = [
            "## Dependency advisory diagnostics (not a security PASS)",
            "",
            "| Scope | All severities | High/critical packages |",
            "| --- | ---: | ---: |",
            "| Full lockfile | " + all.total + " | " + all.highOrCritical + " |",
            "| Production-only (omit dev) | " + runtime.total + " | " + runtime.highOrCritical + " |",
            "",
            "Inspect the job log for advisory IDs, affected ranges and fix availability.",
            "A successful diagnostic job does not mean dependencies are secure."
          ].join("\n") + "\n";
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          }
          NODE
